parameters:
    env(TEST_TOKEN): ''

vich_uploader:
    mappings:
        professional_logos:
            uri_prefix: /images/professional-logos
            upload_destination: '%kernel.project_dir%/var/test-uploads/professional-logos%env(TEST_TOKEN)%'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_update: true
            delete_on_remove: true
